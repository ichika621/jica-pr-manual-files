<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JICA キルギスPR インターン資料</title>
<style>
  :root{color-scheme:light dark;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    max-width:640px;margin:0 auto;padding:32px 20px 60px;line-height:1.7;color:#1f2328;background:#f6f8fa;
  }
  h1{font-size:1.3rem;margin-bottom:4px;}
  p.sub{color:#57606a;margin-top:0;font-size:0.92rem;}
  .card{
    background:#fff;border:1px solid #d0d7de;border-radius:10px;padding:20px;margin:18px 0;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .card h2{font-size:1.05rem;margin:0 0 6px;}
  .card p{margin:4px 0 14px;color:#57606a;font-size:0.9rem;}
  .btn{
    display:inline-block;background:#1f6feb;color:#fff;text-decoration:none;
    padding:10px 18px;border-radius:8px;font-size:0.95rem;font-weight:600;border:none;cursor:pointer;
  }
  .btn:disabled{background:#8c959f;cursor:wait;}
  .btn:hover:not(:disabled){background:#1a5fd0;}
  .status{font-size:0.85rem;margin-top:10px;min-height:1.2em;}
  .status.err{color:#cf222e;}
  .status.ok{color:#1a7f37;}
  footer{margin-top:30px;font-size:0.8rem;color:#8c959f;}
  a.plain{color:#1f6feb;}
</style>
</head>
<body>
  <h1>📎 JICA キルギスPRインターン 資料ダウンロード</h1>
  <p class="sub">このページから、元のファイル（Word／Excel）をそのままダウンロードできます。</p>

  <div class="card">
    <h2>🔥 バズコンテンツマニュアル</h2>
    <p>Instagramリール運用ガイド（Word / .docx）</p>
    <button class="btn" onclick="download_('Instagram_reel_manual.docx','application/vnd.openxmlformats-officedocument.wordprocessingml.document',this)">Wordファイルをダウンロード</button>
    <div class="status" id="st1"></div>
  </div>

  <div class="card">
    <h2>📊 ワークシート（リール分析）</h2>
    <p>リール分析_キルギス（Excel / .xlsx）</p>
    <button class="btn" onclick="download_('reel_analysis_kyrgyz_20260810.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',this)">Excelファイルをダウンロード</button>
    <div class="status" id="st2"></div>
  </div>

  <footer>
    うまくダウンロードできない場合は、リポジトリのファイル一覧からも直接開けます：<br>
    <a class="plain" href="https://github.com/ichika621/jica-pr-manual-files" target="_blank" rel="noopener">github.com/ichika621/jica-pr-manual-files</a>
  </footer>

<script>
let counter = 0;
async function download_(filename, mime, btn){
  counter += 1;
  const statusId = btn.parentElement.querySelector('.status');
  const orig = btn.textContent;
  btn.disabled = true;
  statusId.className = 'status';
  statusId.textContent = '取得中…';
  try {
    const apiUrl = 'https://api.github.com/repos/ichika621/jica-pr-manual-files/contents/' + encodeURIComponent(filename);
    const res = await fetch(apiUrl, {headers:{'Accept':'application/vnd.github.v3+json'}});
    if(!res.ok){ throw new Error('API returned ' + res.status); }
    const data = await res.json();
    const b64 = (data.content || '').replace(/\n/g,'');
    const byteChars = atob(b64);
    const bytes = new Uint8Array(byteChars.length);
    for(let i=0;i<byteChars.length;i++){ bytes[i] = byteChars.charCodeAt(i); }
    const blob = new Blob([bytes], {type: mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 30000);
    statusId.className = 'status ok';
    statusId.textContent = '✓ ダウンロードしました';
  } catch(err){
    statusId.className = 'status err';
    statusId.textContent = '取得に失敗しました（' + err.message + '）。時間をおいて再度お試しください。';
  } finally {
    btn.disabled = false;
    btn.textContent = orig;
  }
}
</script>
</body>
</html>
